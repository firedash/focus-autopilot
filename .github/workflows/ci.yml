# SPDX-License-Identifier: Apache-2.0
# Checks on every push and pull request (design section 13). The token is read-only and each
# third-party action is pinned to a full commit.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Format, lint, test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # rust-toolchain.toml pins the compiler; rustup installs it on first use.
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      - name: Repository rules (required files, SPDX headers, dependency entries)
        run: python3 scripts/check-repo.py

  macos:
    name: Build, lint, test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # The only place the macOS adapter, overlay and hotkey code is compiled and linked.
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked

  dependencies:
    name: Advisories, licenses, sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
