# SPDX-License-Identifier: Apache-2.0
[workspace]
resolver = "3"
members = ["crates/focus-core", "crates/focus-platform", "crates/focus-receiver", "crates/focus-headless", "crates/focus-runner", "crates/focusd", "crates/focusctl"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"
# These crates are an app, not libraries for crates.io.
publish = false

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
must_use_candidate = "allow"
module_name_repetitions = "allow"
