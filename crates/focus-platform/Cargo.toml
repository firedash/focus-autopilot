# SPDX-License-Identifier: Apache-2.0
[package]
name = "focus-platform"
description = "Focus Autopilot platform layer: the Platform trait, known home apps, and a fake for tests."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
focus-core = { path = "../focus-core" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSRunLoop", "NSDate", "NSGeometry", "NSThread"] }
objc2-app-kit = { version = "0.3", features = [
  "NSWorkspace", "NSRunningApplication", "NSSound", "NSApplication", "NSPanel", "NSWindow",
  "NSResponder", "NSView", "NSControl", "NSTextField", "NSText", "NSColor", "NSFont",
  "NSScreen", "NSGraphics", "NSBox", "NSTextFieldCell", "NSCell", "NSEvent",
] }
objc2-core-graphics = { version = "0.3", features = ["CGEventSource", "CGEventTypes"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security",
  "Win32_System_Diagnostics_Debug", "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
