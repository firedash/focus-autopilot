[package]
name = "focusctl"
description = "Focus Autopilot command-line tool: install and remove Claude Code hooks, rotate the token."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
focus-core = { path = "../focus-core" }
focus-platform = { path = "../focus-platform" }
focus-receiver = { path = "../focus-receiver" }
focus-runner = { path = "../focus-runner" }
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
toml_edit = "0.25"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
